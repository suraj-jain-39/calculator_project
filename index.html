<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="fevicon.png">
    <script src="Angular-Folder/angular.min.js"></script>
    <script src="Angular-Folder/app.js"></script>
</head>

<body ng-app="MyApp" ng-controller="MyController1">
    
    <nav class="nav" ng-controller="MyController2">
        <svg ng-click="toggleHistory()" class="historyIcon" title="historyIcon" fill="#505050" width="32px" height="32px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <title>History</title>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.01112 11.5747L6.29288 10.2929C6.68341 9.90236 7.31657 9.90236 7.7071 10.2929C8.09762 10.6834 8.09762 11.3166 7.7071 11.7071L4.7071 14.7071C4.51956 14.8946 4.26521 15 3.99999 15C3.73477 15 3.48042 14.8946 3.29288 14.7071L0.292884 11.7071C-0.0976406 11.3166 -0.0976406 10.6834 0.292884 10.2929C0.683408 9.90236 1.31657 9.90236 1.7071 10.2929L3.0081 11.5939C3.22117 6.25933 7.61317 2 13 2C18.5229 2 23 6.47715 23 12C23 17.5228 18.5229 22 13 22C9.85817 22 7.05429 20.5499 5.22263 18.2864C4.87522 17.8571 4.94163 17.2274 5.37096 16.88C5.80028 16.5326 6.42996 16.599 6.77737 17.0283C8.24562 18.8427 10.4873 20 13 20C17.4183 20 21 16.4183 21 12C21 7.58172 17.4183 4 13 4C8.72441 4 5.23221 7.35412 5.01112 11.5747ZM13 5C13.5523 5 14 5.44772 14 6V11.5858L16.7071 14.2929C17.0976 14.6834 17.0976 15.3166 16.7071 15.7071C16.3166 16.0976 15.6834 16.0976 15.2929 15.7071L12.2929 12.7071C12.1054 12.5196 12 12.2652 12 12V6C12 5.44772 12.4477 5 13 5Z"/>
        </svg>
    </nav>

    <div class="lowerBody">
        
        <div class="calcBG">

            <!--div class="calcScreen">{{result}}</div-->
            <textarea class="calcScreen" ng-model="result"></textarea>
            <div class="delIcon">
                <svg ng-click="del()" class="delSVG" title="delIcon" width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.0004 9.5L17.0004 14.5M17.0004 9.5L12.0004 14.5M4.50823 13.9546L7.43966 17.7546C7.79218 18.2115 7.96843 18.44 8.18975 18.6047C8.38579 18.7505 8.6069 18.8592 8.84212 18.9253C9.10766 19 9.39623 19 9.97336 19H17.8004C18.9205 19 19.4806 19 19.9084 18.782C20.2847 18.5903 20.5907 18.2843 20.7824 17.908C21.0004 17.4802 21.0004 16.9201 21.0004 15.8V8.2C21.0004 7.0799 21.0004 6.51984 20.7824 6.09202C20.5907 5.71569 20.2847 5.40973 19.9084 5.21799C19.4806 5 18.9205 5 17.8004 5H9.97336C9.39623 5 9.10766 5 8.84212 5.07467C8.6069 5.14081 8.38579 5.2495 8.18975 5.39534C7.96843 5.55998 7.79218 5.78846 7.43966 6.24543L4.50823 10.0454C3.96863 10.7449 3.69883 11.0947 3.59505 11.4804C3.50347 11.8207 3.50347 12.1793 3.59505 12.5196C3.69883 12.9053 3.96863 13.2551 4.50823 13.9546Z" stroke="#505050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <div class="calcPad">
                <div class="button" ng-click="clear()">C</div>
                <div class="button" ng-click="enter('()')">()</div>
                <div class="button" ng-click="enter('%')">%</div>
                <div class="button" ng-click="enter('/')">/</div>

                <div class="button" ng-click="enter(7)">7</div>
                <div class="button" ng-click="enter(8)">8</div>
                <div class="button" ng-click="enter(9)">9</div>
                <div class="button" ng-click="enter('x')">x</div>

                <div class="button" ng-click="enter(4)">4</div>
                <div class="button" ng-click="enter(5)">5</div>
                <div class="button" ng-click="enter(6)">6</div>
                <div class="button" ng-click="enter('-')">-</div>

                <div class="button" ng-click="enter(1)">1</div>
                <div class="button" ng-click="enter(2)">2</div>
                <div class="button" ng-click="enter(3)">3</div>
                <div class="button" ng-click="enter('+')">+</div>

                <div class="button" ng-click="enter('m')">+/-</div>
                <div class="button" ng-click="enter(0)">0</div>
                <div class="button" ng-click="enter('.')">.</div>
                <div class="button" ng-click="calculate()">=</div>
            </div>

        </div>

    </div>

    <div class="rightMenu">
    </div>

</body>

</html>
